name: Manual Docker Deploy to EC2

on:
  workflow_dispatch: # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/truwiz:latest .

      - name: Push Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/truwiz:latest

      - name: Copy PEM key
        run: |
          echo "${{ secrets.EC2_KEY }}" > ec2key.pem
          chmod 600 ec2key.pem

      - name: Connect to EC2 and deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            docker pull ${{ secrets.DOCKER_USERNAME }}/truwiz:latest
            docker stop truwiz || true && docker rm springboot-app || true
            docker run -d --name truwiz -p 80:8080 ${{ secrets.DOCKER_USERNAME }}/truwiz:latest
          EOF

