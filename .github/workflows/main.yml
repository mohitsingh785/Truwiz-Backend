name: Manual Docker Deploy to EC2

on:
  workflow_dispatch: # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      JDBC_DATABASE_URL: ${{ secrets.JDBC_DATABASE_URL }}
      JDBC_DATABASE_USERNAME: ${{ secrets.JDBC_DATABASE_USERNAME }}
      JDBC_DATABASE_PASSWORD: ${{ secrets.JDBC_DATABASE_PASSWORD }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Maven
        run: mvn clean install -DskipTests

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/truwiz:latest .

      - name: Push Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/truwiz:latest

      - name: Copy PEM key
        run: |
          echo "${{ secrets.EC2_KEY }}" > ec2key.pem
          chmod 600 ec2key.pem

      - name: Connect to EC2 and deploy
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            docker pull ${{ secrets.DOCKER_USERNAME }}/truwiz:latest
            docker stop truwiz || true && docker rm truwiz || true
            docker run -d \
              --name truwiz \
              -p 80:8080 \
              -e JDBC_DATABASE_URL="${JDBC_DATABASE_URL}" \
              -e JDBC_DATABASE_USERNAME="${JDBC_DATABASE_USERNAME}" \
              -e JDBC_DATABASE_PASSWORD="${JDBC_DATABASE_PASSWORD}" \
              -e MAIL_USERNAME="${MAIL_USERNAME}" \
              -e MAIL_PASSWORD="${MAIL_PASSWORD}" \
              ${{ secrets.DOCKER_USERNAME }}/truwiz:latest
          EOF
      

